<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make It Count Goodies – Order</title>
<script>
/* =====================================================================
   BAKER SETTINGS — edit this section only
   ===================================================================== */

// Where orders get emailed.
const BAKER_EMAIL = "galaxygoodies420@gmail.com";

// How orders are sent:
//   "formsubmit" – sends straight from the page via FormSubmit.co (free, no account).
//                  The very first order triggers a one-time "Activate" email to
//                  BAKER_EMAIL; click it and every order after that arrives normally.
//   "mailto"     – opens the customer's own email app with the order filled in.
const SEND_METHOD = "formsubmit";

// Google Sheet menu (recommended). Paste the sheet's "Publish to web" CSV link
// between the quotes and the menu below is replaced by whatever is in the sheet.
// Leave it as "" to use the menu below instead. See README.md for setup.
const MENU_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRb6j9RQa-Ndl37ZBz7fms-KnPt8pUD-ynr-sgIDr_Uh6_u-mIfjt8VV8G7KRmmDJQbLReIi36FUxpn/pub?output=csv";

// Backup menu – used when MENU_SHEET_URL is empty or the sheet can't be loaded.
// Add, remove, or change lines. Keep the commas between items.
//   name   – item name
//   desc   – short description (optional, use "" for none)
//   dose   – potency per piece (optional, use "" for none)
//   price  – price per unit, numbers only
//   unit   – what one unit is, e.g. "each", "4-pack", "dozen"
//   soldOut – set to true to show the item but block ordering
const MENU = [
  { name: "Brown Butter Brownies",  desc: "Fudgy, rich, classic.",            dose: "10mg THC", price: 6,  unit: "each" },
  { name: "Chocolate Chip Cookies", desc: "Soft-baked with sea salt.",         dose: "5mg THC",  price: 15, unit: "4-pack" },
  { name: "Lemon Bars",             desc: "Tart, buttery shortbread crust.",   dose: "10mg THC", price: 7,  unit: "each" },
  { name: "Rice Krispie Treats",    desc: "Gooey marshmallow goodness.",       dose: "10mg THC", price: 5,  unit: "each" },
  { name: "Gummies",                desc: "Mixed fruit flavors.",              dose: "5mg THC",  price: 20, unit: "10-pack" },
  { name: "Seasonal Special",       desc: "Ask about this month's flavor!",    dose: "10mg THC", price: 8,  unit: "each", soldOut: true },
];

// Optional extras
const CURRENCY = "$";
const MAX_QTY_PER_ITEM = 20;
const MISSION = "Make It Count Goodies was born from my love of homemade treats, good vibes, and knowing just how precious life really is. As a two-time cancer survivor, I know firsthand that every moment counts. I'm here to spread love, lift spirits, satisfy the advanced space cadet, and turn my passion into a way to give back to the cancer community. Homemade with heart, loaded with hippie calories, and made to make every bite count.";
const NOTE_AT_TOP ="Orders are for adults 21+ only. We'll confirm your order and total by text or email.";

/* ===================================================================== */
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --card: #141414;
    --ink: #f2f2f2;
    --muted: #a0a0a0;
    --line: #2e2e2e;
    --accent: #4caf64;
    --accent-ink: #ffffff;
    --field: #0a0a0a;
    --warn: #ff6b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 1.9rem; letter-spacing: .5px; }
  header .logo { display: block; margin: 0 auto; width: min(360px, 85vw); height: auto; }
  header p { margin: 6px 0 0; color: var(--muted); }
  header p.mission { margin: 14px auto 16px; max-width: 560px; color: var(--ink); font-style: italic; line-height: 1.6; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .item {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: .9rem; }
  .item .price { font-weight: 600; white-space: nowrap; }
  .item.sold { opacity: .5; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--ink); font-size: 1.1rem; cursor: pointer;
  }
  .qty input { width: 44px; height: 34px; text-align: center; border: 1px solid var(--line); border-radius: 8px; font-size: 1rem; background: var(--field); color: var(--ink); }
  .sold-tag { color: var(--warn); font-weight: 600; font-size: .85rem; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=date], textarea, select {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--field); color: var(--ink);
  }
  textarea { min-height: 80px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) {
    .row { grid-template-columns: 1fr; }
    /* Phones: name and description on top, price and quantity on a row below */
    .item { flex-wrap: wrap; row-gap: 8px; }
    .item .info { flex-basis: 100%; }
    .item .qty, .item .sold-tag { margin-left: auto; }
  }
  .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
  .check input { margin-top: 4px; }
  .total { display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700; }
  .summary { color: var(--muted); font-size: .9rem; margin-top: 6px; white-space: pre-line; }
  button.submit {
    width: 100%; padding: 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font-size: 1.05rem; font-weight: 700; cursor: pointer;
  }
  button.submit:disabled { opacity: .6; cursor: default; }
  .msg { text-align: center; margin-top: 12px; font-weight: 600; }
  .msg.err { color: var(--warn); }
  .msg.ok { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="logo" src="logo.jpg" width="800" height="800" alt="Make It Count Goodies – Whatever That Means To You! Cannabis-infused treats"></h1>
    <p class="mission" id="mission"></p>
    <p id="topNote"></p>
  </header>

  <form id="orderForm" novalidate>
    <section>
      <h2>Menu</h2>
      <div id="menu"></div>
    </section>

    <section>
      <h2>Your info</h2>
      <div class="row">
        <div><label for="name">Name *</label><input id="name" type="text" required></div>
        <div><label for="phone">Phone *</label><input id="phone" type="tel" required></div>
      </div>
      <label for="email">Email *</label><input id="email" type="email" required>
      <div class="row">
        <div>
          <label for="method">Pickup or delivery</label>
          <select id="method"><option>Pickup</option><option>Delivery</option></select>
        </div>
        <div><label for="date">Preferred date</label><input id="date" type="date"></div>
      </div>
      <label for="notes">Notes / address / special requests</label>
      <textarea id="notes"></textarea>
      <label class="check"><input id="age" type="checkbox"> I confirm I am 21 or older. *</label>
    </section>

    <section>
      <div class="total"><span>Estimated total</span><span id="total">$0.00</span></div>
      <div class="summary" id="summary">No items selected yet.</div>
    </section>

    <button class="submit" id="submitBtn" type="submit">Submit Order</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
  const $ = id => document.getElementById(id);
  const money = n => CURRENCY + n.toFixed(2);
  let menu = MENU;
  let qtys = [];

  $("mission").textContent = MISSION;
  $("topNote").textContent = NOTE_AT_TOP;

  const menuEl = $("menu");
  function renderMenu() {
    qtys = menu.map(() => 0);
    menuEl.innerHTML = "";
    menu.forEach((it, i) => {
      const row = document.createElement("div");
      row.className = "item" + (it.soldOut ? " sold" : "");
      const meta = [it.desc, it.dose].filter(Boolean).join(" · ");
      row.innerHTML = `
        <div class="info">
          <div class="name"></div>
          <div class="meta"></div>
        </div>
        <div class="price">${money(it.price)} <span class="meta unit"></span></div>
        ${it.soldOut
          ? '<span class="sold-tag">Sold out</span>'
          : `<div class="qty">
               <button type="button" data-i="${i}" data-d="-1" aria-label="Less">−</button>
               <input type="number" min="0" max="${MAX_QTY_PER_ITEM}" value="0" data-i="${i}" aria-label="Quantity">
               <button type="button" data-i="${i}" data-d="1" aria-label="More">+</button>
             </div>`}`;
      row.querySelector(".name").textContent = it.name;
      row.querySelector(".info .meta").textContent = meta;
      row.querySelector(".unit").textContent = "/ " + (it.unit || "each");
      menuEl.appendChild(row);
    });
    refresh();
  }

  // --- Google Sheet menu -------------------------------------------------
  // Columns (header row, any order): Name, Description, Dose, Price, Unit, Sold Out
  function parseCsv(text) {
    const rows = [[]];
    let field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') quoted = false;
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { rows[rows.length - 1].push(field); field = ""; }
      else if (c === "\n") { rows[rows.length - 1].push(field); field = ""; rows.push([]); }
      else if (c !== "\r") field += c;
    }
    rows[rows.length - 1].push(field);
    return rows;
  }
  function sheetCsvUrl(url) {
    // A "Publish to web" link copied in web-page form: ask for CSV instead.
    if (/\/pubhtml/.test(url)) return url.replace(/\/pubhtml.*$/, "/pub?output=csv");
    // Accept a normal sheet link too, as long as it's shared "Anyone with the link".
    const m = url.match(/\/spreadsheets\/d\/([\w-]{20,})/);
    return m ? `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv` : url;
  }
  async function loadSheetMenu() {
    const res = await fetch(sheetCsvUrl(MENU_SHEET_URL), { cache: "no-store" });
    if (!res.ok) throw new Error("Sheet returned " + res.status);
    const [header, ...rows] = parseCsv(await res.text());
    const col = names => header.findIndex(h => names.includes(h.trim().toLowerCase()));
    const c = {
      name: col(["name", "item"]),
      desc: col(["description", "desc"]),
      dose: col(["dose", "potency"]),
      price: col(["price"]),
      unit: col(["unit"]),
      sold: col(["sold out", "soldout", "sold"]),
    };
    if (c.name < 0 || c.price < 0) throw new Error("Sheet needs Name and Price columns");
    const get = (r, k) => (c[k] >= 0 ? (r[c[k]] || "").trim() : "");
    const items = rows
      .map(r => ({
        name: get(r, "name"),
        desc: get(r, "desc"),
        dose: get(r, "dose"),
        price: parseFloat(get(r, "price").replace(/[^0-9.]/g, "")),
        unit: get(r, "unit"),
        soldOut: /^(y|yes|true|x|1|sold ?out)$/i.test(get(r, "sold")),
      }))
      .filter(it => it.name && !isNaN(it.price));
    if (!items.length) throw new Error("Sheet has no menu items");
    return items;
  }

  function setQty(i, v) {
    v = Math.max(0, Math.min(MAX_QTY_PER_ITEM, parseInt(v, 10) || 0));
    qtys[i] = v;
    menuEl.querySelector(`input[data-i="${i}"]`).value = v;
    refresh();
  }
  menuEl.addEventListener("click", e => {
    const b = e.target.closest("button[data-i]");
    if (b) setQty(+b.dataset.i, qtys[+b.dataset.i] + +b.dataset.d);
  });
  menuEl.addEventListener("change", e => {
    if (e.target.matches("input[data-i]")) setQty(+e.target.dataset.i, e.target.value);
  });

  function lines() {
    return menu.map((it, i) => ({ it, q: qtys[i] })).filter(x => x.q > 0);
  }
  function total() {
    return lines().reduce((s, x) => s + x.q * x.it.price, 0);
  }
  function refresh() {
    const l = lines();
    $("total").textContent = money(total());
    $("summary").textContent = l.length
      ? l.map(x => `${x.q} × ${x.it.name} (${x.it.unit || "each"}) — ${money(x.q * x.it.price)}`).join("\n")
      : "No items selected yet.";
  }

  function buildOrderText() {
    const l = lines();
    return [
      "NEW ORDER — Make It Count Goodies",
      "",
      "ITEMS",
      ...l.map(x => `  ${x.q} × ${x.it.name} (${x.it.unit || "each"}, ${x.it.dose || "—"}) @ ${money(x.it.price)} = ${money(x.q * x.it.price)}`),
      "",
      `ESTIMATED TOTAL: ${money(total())}`,
      "",
      "CUSTOMER",
      `  Name:   ${$("name").value.trim()}`,
      `  Phone:  ${$("phone").value.trim()}`,
      `  Email:  ${$("email").value.trim()}`,
      `  ${$("method").value} on: ${$("date").value || "not specified"}`,
      `  Notes:  ${$("notes").value.trim() || "—"}`,
      `  Confirmed 21+: yes`,
    ].join("\n");
  }

  function showMsg(text, ok) {
    $("msg").textContent = text;
    $("msg").className = "msg " + (ok ? "ok" : "err");
  }

  $("orderForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!lines().length) return showMsg("Please choose at least one item.");
    if (!$("name").value.trim() || !$("phone").value.trim() || !$("email").checkValidity() || !$("email").value.trim())
      return showMsg("Please fill in your name, phone, and a valid email.");
    if (!$("age").checked) return showMsg("Please confirm you are 21 or older.");

    const text = buildOrderText();
    const subject = `Order from ${$("name").value.trim()} — ${money(total())}`;

    if (SEND_METHOD === "mailto") {
      location.href = `mailto:${BAKER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
      return showMsg("Your email app should open with the order — just hit Send.", true);
    }

    const btn = $("submitBtn");
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const res = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(BAKER_EMAIL)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: subject,
          _replyto: $("email").value.trim(),
          _template: "box",
          _captcha: "false",
          Order: text,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === "false" || data.success === false) throw new Error(data.message || "Send failed");
      showMsg("Thanks! Your order was sent. We'll be in touch to confirm.", true);
      $("orderForm").reset();
      menu.forEach((it, i) => { if (!it.soldOut) setQty(i, 0); });
    } catch (err) {
      if (/activat/i.test(err.message))
        return showMsg("Form not activated yet — check " + BAKER_EMAIL + " for the 'Activate Form' email from FormSubmit.");
      showMsg("Sorry, the order couldn't be sent. Please try again or contact us directly.");
    } finally {
      btn.disabled = false; btn.textContent = "Submit Order";
    }
  });

  if (MENU_SHEET_URL) {
    menuEl.innerHTML = '<div class="meta">Loading menu…</div>';
    loadSheetMenu()
      .then(items => { menu = items; })
      .catch(err => console.warn("Using backup menu:", err.message))
      .finally(renderMenu);
  } else {
    renderMenu();
  }
</script>
</body>
</html>
